name: 部署到 Cloudflare Pages

# 为什么要有这个工作流？
#   GitHub Pages 不支持自定义响应头，因此站点同时部署到 Cloudflare Pages（免费），
#   由它执行仓库里的 _headers 策略。GitHub Pages 保持不动，随时可回滚。
#
# 前置条件（一次性，见 DEPLOY-CLOUDFLARE.md）：
#   在仓库 Secrets 中配置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
#   未配置时本工作流会优雅跳过，不会失败。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 站点自检（28 项：结构 / 链接 / SEO / 无障碍 / 零依赖）
        run: node scripts/validate-site.mjs

      - name: 组装发布目录（白名单，仅公开必要文件）
        run: node scripts/build-public.mjs

      - name: 检查 Cloudflare 凭据是否可用
        id: creds
        env:
          # 关键：密钥必须通过 env 注入，绝不能插值进 run: 脚本本体。
          # 直接插值（${{ secrets.X }}）会在值含换行/引号时截断引号、导致脚本语法错误
          # —— 实测踩过：报 "unexpected EOF while looking for matching quote"。
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 粘贴到密钥框时容易带上首尾空白/换行，这里统一清理
          token="$(printf '%s' "$RAW_API_TOKEN" | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_ACCOUNT_ID" | tr -d '[:space:]')"

          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Cloudflare 凭据，跳过部署。配置方法见 DEPLOY-CLOUDFLARE.md"
            exit 0
          fi

          # 格式自检：Cloudflare API Token 为 40 位 [A-Za-z0-9_-]，账户 ID 为 32 位十六进制。
          # 只输出长度、不输出值 —— 便于定位"粘贴带了多余字符"这类问题。
          if ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{40}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN 格式不正确（实际长度 ${#token}，应为 40 位字母数字/下划线/连字符）"
            echo "   常见原因：粘贴时带入了换行或多余空格。请重新设置该密钥："
            echo "   gh secret set CLOUDFLARE_API_TOKEN --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          if ! printf '%s' "$account" | grep -Eq '^[A-Za-z0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不正确（实际长度 ${#account}，应为 32 位十六进制）"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "::notice::凭据格式校验通过，开始部署"

      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=frank2673-site --branch=main

      - name: 部署后校验线上响应头
        if: steps.creds.outputs.ready == 'true'
        run: |
          # 给 Cloudflare 一点生效时间
          sleep 10
          node scripts/check-deployed-headers.mjs --url https://frank2673-site.pages.dev/

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "## Cloudflare Pages 部署"
            echo ""
            if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
              echo "- ✅ 已部署到 https://frank2673-site.pages.dev/"
              echo "- 响应头策略由仓库根目录 \`_headers\` 执行（由 header-forge 生成）"
            else
              echo "- ⏭️ 已跳过：未配置 Cloudflare 凭据"
              echo "- 配置方法见 [DEPLOY-CLOUDFLARE.md](../blob/main/DEPLOY-CLOUDFLARE.md)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
