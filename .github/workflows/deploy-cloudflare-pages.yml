name: 部署到 Cloudflare Pages

# 为什么要有这个工作流？
#   GitHub Pages 不支持自定义响应头，因此站点同时部署到 Cloudflare Pages（免费），
#   由它执行仓库里的 _headers 策略。GitHub Pages 保持不动，随时可回滚。
#
# 前置条件（一次性，见 DEPLOY-CLOUDFLARE.md）：
#   在仓库 Secrets 中配置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID
#   未配置时本工作流会优雅跳过，不会失败。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 站点自检（28 项：结构 / 链接 / SEO / 无障碍 / 零依赖）
        run: node scripts/validate-site.mjs

      - name: 组装发布目录（白名单，仅公开必要文件）
        run: node scripts/build-public.mjs

      - name: 检查 Cloudflare 凭据是否可用
        id: creds
        env:
          # 关键：密钥必须通过 env 注入，绝不能插值进 run: 脚本本体。
          # 直接插值（${{ secrets.X }}）会在值含换行/引号时截断引号、导致脚本语法错误
          # —— 实测踩过：报 "unexpected EOF while looking for matching quote"。
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 密钥清理：粘贴时最容易带入换行、全角字符或零宽字符（复制自网页尤其常见）。
          # 这些字符不是空白，简单的 tr -d '[:space:]' 去不掉，会让 Authorization 头
          # 变成非法格式（Cloudflare 报 code 6111 Invalid format for Authorization header）。
          # 因此只保留可打印 ASCII（\040-\0176），其余一律剔除。
          # 注意：这里用 POSIX 字符类 [:print:] 而非八进制区间。
          # 八进制写法有个坑 —— tr 的 \ooo 最多解析 3 位，`\040-\0176` 会被拆成
          # `\017`(=15) + 字面量 '6'，区间反向，tr 直接输出空值（实测踩过，令牌被清空）。
          token="$(printf '%s' "$RAW_API_TOKEN" | LC_ALL=C tr -cd '[:print:]' | tr -d '[:space:]')"
          account="$(printf '%s' "$RAW_ACCOUNT_ID" | LC_ALL=C tr -cd '[:print:]' | tr -d '[:space:]')"

          # 诊断：若清理确实去掉了东西，打印被剔除字符的十六进制码点
          # （只暴露"杂字符"的字节，不暴露令牌内容）
          stray="$(printf '%s' "$RAW_API_TOKEN" | LC_ALL=C tr -d '[:print:]' | LC_ALL=C od -An -tx1 | tr -s ' ' | tr -d '\n')"
          if [ -n "$(printf '%s' "$stray" | tr -d ' ')" ]; then
            echo "::warning::密钥中含有非法字符（已自动剔除），其十六进制码点为:${stray}"
            echo "   建议用 gh secret set 重新设置该密钥，避免网页粘贴带入不可见字符"
          fi

          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Cloudflare 凭据，跳过部署。配置方法见 DEPLOY-CLOUDFLARE.md"
            exit 0
          fi

          # 格式自检（只输出长度与判定，不输出值）。
          # 注意：Cloudflare 自 2026 年起新建令牌采用带前缀的可扫描格式：
          #   cfut_[40 字符][校验和]  = 用户级 API Token
          #   cfat_[40 字符][校验和]  = 账户级 API Token
          #   cfk_[40 字符][校验和]   = Global API Key
          # 旧格式（40 位无前缀字母数字）对老令牌仍然有效。
          # 校验原则：只拦「明显不是 Cloudflare 凭证」的情况，其余交给 API 判定 ——
          # 避免因为格式假设过时而把有效令牌误判（本项目就踩过这个坑）。
          if printf '%s' "$token" | grep -Eq '^cf(ut|at|k)_[A-Za-z0-9]{40,}$'; then
            echo "::notice::已识别为 Cloudflare 带前缀令牌（${token:0:5}…，共 ${#token} 位）"
          elif printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{40}$'; then
            echo "::notice::已识别为 Cloudflare 旧版 40 位令牌"
          elif printf '%s' "$token" | grep -Eq '^(ghp_|gho_|ghs_|github_pat_|AKIA|ASIA|sk-|xox[bp]-|AIza)'; then
            echo "::error::这个密钥看起来是其它平台的凭证，不是 Cloudflare API Token"
            echo "   请到 https://dash.cloudflare.com/profile/api-tokens 重新创建"
            exit 1
          else
            echo "::warning::令牌格式不在已知范围内（长度 ${#token}）—— 仍会继续尝试，若失败请确认复制的是 API Token 而非其它值"
          fi

          if ! printf '%s' "$account" | grep -Eq '^[A-Za-z0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不正确（实际长度 ${#account}，应为 32 位十六进制）"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "::notice::凭据格式校验通过，开始部署"

      - name: 令牌有效性诊断（失败时便于定位原因）
        if: steps.creds.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$CF_TOKEN" | LC_ALL=C tr -cd '[:print:]' | tr -d '[:space:]')"
          account="$(printf '%s' "$CF_ACCOUNT" | LC_ALL=C tr -cd '[:print:]' | tr -d '[:space:]')"

          echo "▶ ① 令牌本身是否有效（/user/tokens/verify）"
          curl -s -H "Authorization: Bearer $token" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 600
          echo ""

          echo "▶ ② 令牌能否访问目标账号（/accounts/<id>）"
          code=$(curl -s -o /tmp/acct.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$account")
          echo "HTTP $code"
          head -c 600 /tmp/acct.json
          echo ""

          echo "▶ ③ 令牌能否列出 Pages 项目（真正要用的权限）"
          code2=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$account/pages/projects")
          echo "HTTP $code2"
          head -c 600 /tmp/pages.json
          echo ""
          echo "（以上输出只含状态与资源名，不含令牌本身）"

      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 显式指定 4.x：action 默认会装 3.x，与本地开发版本不一致
          wranglerVersion: '4'
          command: pages deploy public --project-name=frank2673-site --branch=main

      - name: 部署后校验线上响应头
        if: steps.creds.outputs.ready == 'true'
        run: |
          # 给 Cloudflare 一点生效时间
          sleep 10
          node scripts/check-deployed-headers.mjs --url https://frank2673-site.pages.dev/

      - name: 部署摘要
        if: always()
        run: |
          {
            echo "## Cloudflare Pages 部署"
            echo ""
            if [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
              echo "- ✅ 已部署到 https://frank2673-site.pages.dev/"
              echo "- 响应头策略由仓库根目录 \`_headers\` 执行（由 header-forge 生成）"
            else
              echo "- ⏭️ 已跳过：未配置 Cloudflare 凭据"
              echo "- 配置方法见 [DEPLOY-CLOUDFLARE.md](../blob/main/DEPLOY-CLOUDFLARE.md)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
