<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面走丢了 | Frank2673</title>
<meta name="description" content="页面不存在 —— 返回 Frank2673 的个人主页。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<!-- 注：错误页样式已移至 assets/css/style.css（第 17 节）。
     原因：CSP 的 style-src 'self' 会拦截内联 <style>，放在样式表里才不会被拦。 -->
</head>
<body>
<main class="error-wrap">
  <div>
    <p class="error-code">404</p>
    <h1 class="error-title">这个页面走丢了</h1>
    <p class="error-desc">
      你访问的地址不存在，可能是链接写错了，或者这个页面还在路上。
      不如回主页看看已经完成的东西？
    </p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/">返回主页</a>
      <a class="btn btn-ghost" href="https://github.com/Frank2673" target="_blank" rel="noopener noreferrer">去 GitHub</a>
    </div>
  </div>
</main>
<script src="/assets/js/main.js" defer></script>
</body>
</html>
